<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Limpador de Página{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="nav">
    <a class="brand" href="{{ url_for('landing') }}">Limpador de Página</a>
    <div class="nav-links">
      {% if user %}
        <span class="nav-mail">{{ user.email }}</span>
        <a href="{{ url_for('painel') }}">Painel</a>
        {% if not acesso %}
          <a href="{{ url_for('pagar') }}">PIX {{ limite_teste }}+</a>
        {% endif %}
        <a href="{{ url_for('sair') }}">Sair</a>
      {% else %}
        <a href="{{ url_for('login') }}">Entrar</a>
        <a class="nav-cta" href="{{ url_for('cadastro') }}">Criar conta</a>
      {% endif %}
    </div>
  </div>
  {% block body %}{% endblock %}
</body>
</html>
